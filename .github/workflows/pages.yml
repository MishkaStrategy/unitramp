name: Publish site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Synchronize source catalogue
        run: python scripts/crawl_unitramp.py --output generated-catalog.js --report data/catalog-report.json --generate-pages --min-count 650
      - name: Preserve source category routes
        run: python scripts/generate_category_pages.py
      - name: Publish generated snapshot to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-catalog.js data/catalog-report.json katalog
          git commit -m "Build catalogue snapshot from unitramp.ru" || true
          git push origin HEAD:gh-pages --force
